name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential ccache \
            autoconf automake libtool libltdl-dev \
            pkg-config cmake zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0 cython==0.29.34

      - name: Prepare CI Buildozer spec
        run: |
          cp buildozer.spec buildozer-ci.spec
          sed -i 's/^android.ndk = .*/android.ndk = 28c/' buildozer-ci.spec
          sed -i 's/^android.api = .*/android.api = 35/' buildozer-ci.spec
          echo "===== Android settings used by CI ====="
          grep -E '^(android.api|android.minapi|android.ndk|android.ndk_api|android.archs)' buildozer-ci.spec

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-ndk28-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-ndk28-${{ runner.os }}-

      - name: Build debug APK
        run: |
          buildozer -v -f buildozer-ci.spec android debug

      - name: Prepare APK
        run: |
          mkdir -p dist
          APK="$(find bin -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          cp "$APK" dist/TaskManager.apk
          ls -lh dist/TaskManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-apk
          path: dist/TaskManager.apk
          if-no-files-found: error
