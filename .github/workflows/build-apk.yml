name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages needed by Buildozer / python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip build-essential ccache autoconf automake libtool libltdl-dev \
            pkg-config cmake zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          pip install buildozer==1.6.0 cython==0.29.34

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Name the APK TaskManager.apk
        run: |
          mkdir -p dist
          APK="$(ls bin/*.apk | head -n 1)"
          echo "Built: $APK"
          cp "$APK" dist/TaskManager.apk
          ls -lh dist

      - name: Upload TaskManager.apk
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-apk
          path: dist/TaskManager.apk
          if-no-files-found: error
